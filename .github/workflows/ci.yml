name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Quality and tests
    runs-on: ubuntu-24.04
    # A newer push supersedes the checks of an older one. The deployment, which
    # must never be cut off mid-migration, has its own group below.
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cdf2
          POSTGRES_USER: cdf2
          POSTGRES_PASSWORD: cdf2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdf2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for an ephemeral test database: nothing here is a secret.
      SECRET_KEY: ci-throwaway-key-not-used-anywhere-else
      POSTGRES_DB: cdf2
      POSTGRES_USER: cdf2
      POSTGRES_PASSWORD: cdf2
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks as on every local commit: ruff, secrets detection,
      # migrations up to date, OpenAPI schema exported and valid.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests with full coverage
        run: uv run pytest --cov

      # The release runs these checks with the production settings, and fails
      # on a warning: they run here first, with fictitious values, so that a
      # build that passes never fails to deploy.
      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-throwaway-key-for-the-deployment-checks-only-0123456789
          ALLOWED_HOSTS: example.org
          MEDIA_ROOT: /tmp/private
          SITE_URL: https://example.org
          DEFAULT_FROM_EMAIL: Comité des fêtes <comite@example.org>
          MAILER_HOST: smtp.example.org
          MAILER_USERNAME: comite@example.org
          MAILER_PASSWORD: not-a-real-password
        run: uv run python manage.py check --deploy --fail-level WARNING

  deploy:
    name: Deploy to preproduction
    needs: checks
    # Only a commit pushed to main is deployed, never a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: preprod
    # One deployment at a time, never cancelled: stopping one could leave a
    # migration halfway. A newer pending deployment replaces an older one.
    concurrency:
      group: deploy-preprod
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      # The key only runs the release script on the server, which takes the
      # commit SHA as its single input. The script fetches that commit itself
      # and answers with one status line, as the logs of this run are public.
      - name: Deploy the tested commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"

  deploy-production:
    name: Deploy to production
    # The commit the preproduction runs, never another one.
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Waits for the approval of the environment's reviewer.
    environment: production
    # As for the preproduction: one deployment at a time, never cancelled. A
    # newer deployment waiting for approval replaces an older one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      - name: Deploy the tested commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
